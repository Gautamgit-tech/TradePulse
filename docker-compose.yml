services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - tradepulse-network

  tradepulse-backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/tradepulse_db
      SERVER_PORT: "8081"
      TRADEPULSE_JWT_SECRET: ${TRADEPULSE_JWT_SECRET:?Set TRADEPULSE_JWT_SECRET to a base64-encoded key of at least 32 bytes}
    networks:
      - tradepulse-network

volumes:
  mongodb_data:

networks:
  tradepulse-network:
    driver: bridge
