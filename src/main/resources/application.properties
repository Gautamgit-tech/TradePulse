spring.application.name=tradepulse
server.port=8081

# MongoDB Local URL
spring.data.mongodb.uri=mongodb://localhost:27017/tradepulse_db
spring.data.mongodb.auto-index-creation=true

logging.level.com.tradepulse=INFO
tradepulse.jwt.secret=${TRADEPULSE_JWT_SECRET:TradePulseSuperSecretInstitutionalKeyForLocalDev2026SecureKey!}
tradepulse.jwt.expiration-ms=86400000
tradepulse.market-data.provider=finnhub
tradepulse.market-data.finnhub-api-key=${FINNHUB_API_KEY:YOUR_FINNHUB_KEY_HERE}
tradepulse.market-data.symbols=AAPL,NVDA,MSFT,TSLA,AMZN,GOOGL,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:SOLUSDT